[tool.poetry]
name = "shotgrid-ami"
version = "0.6.10+rvx.16"
description = "Service that handles the shotgun action menu items"
authors = ["Oscar Domingo <oscar.domingo@ynput.com>"]
package-mode = false

[[tool.poetry.source]]
name = "rvx-group"
url = "https://nexus.eu.rvx.is/repository/rvx-group/simple"
priority = "primary"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
arrow = "*"
ayon-python-api = "1.2.1"
shotgun-api3 = "3.8.5"
fastapi = ">=0.119.1"
uvicorn = ">=0.38.0"
jinja2 = ">=3.1.6"
python-multipart = ">=0.0.20"
corder = "*"

[tool.poetry.dev-dependencies]
pytest = "^5.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
