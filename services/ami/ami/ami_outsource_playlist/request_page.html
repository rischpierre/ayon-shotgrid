<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f172a;
    --panel: #0b1220;
    --text: #e5e7eb;
    --muted: #9ca3af;
  }
  body {
    margin: 0; padding: 24px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    overflow: hidden;
  }
  .header {
    padding: 18px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    background: linear-gradient(180deg, rgba(0,0,0,0.2), rgba(0,0,0,0));
  }
  h1 { font-size: 18px; margin: 0; }
  .content { padding: 18px 20px; }
  .info-box {
    background: rgba(59, 130, 246, 0.1);
    border: 1px solid rgba(59, 130, 246, 0.3);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 16px;
    font-size: 14px;
    color: var(--muted);
  }
  label {
    display: block;
    margin: 12px 0;
  }
  label span {
    display: inline-block;
    width: 180px;
    font-weight: 600;
  }
  input[type="text"],
  textarea {
    min-width: 320px;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid #555;
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }
  textarea {
    resize: vertical;
    min-height: 80px;
  }
  input[type="text"]:focus,
  textarea:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
  }
  button {
    background: linear-gradient(180deg, #16a34a, #15803d);
    color: white;
    border: 1px solid #22c55e;
    border-radius: 8px;
    padding: 10px 20px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 16px;
    font-size: 15px;
  }
  button:hover {
    background: linear-gradient(180deg, #15803d, #166534);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header">
        <h1>📤 {{ heading }}</h1>
      </div>
      <div class="content">
        <div class="info-box">
          💡 Configure the vendor and description for your outsource collection job. The job will be submitted to the farm in Suspended state.
        </div>
        <form method="post" action="{{ action_url }}">
          {{ hidden_inputs|safe }}
          {{ inputs_html|safe }}
          <div>
            <button type="submit">{{ submit_label }}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
