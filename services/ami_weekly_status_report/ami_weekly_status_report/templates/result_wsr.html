<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ title or "Weekly Status Report" }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="header">
      <h1>{{ title or "Weekly Status Report" }}</h1>
    </div>
    <div class="content">
      <div class="info-box">
        📊 <strong>Weekly Status Report Generated</strong>
      </div>
      <p class="message">
        {{ message or "Your weekly status report has been successfully created with all project data." }}
      </p>
      <div class="actions">
        <a href="/weekly-status-report/download/report" class="btn">📥 Download Report (XLSX)</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
