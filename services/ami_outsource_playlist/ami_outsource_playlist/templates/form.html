<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="wrap">
    <div class="card">
        <div class="content">
            <div class="info-box">
                💡 Configure the vendor and description for your outsource collection job. The job will be submitted to
                the farm.
            </div>
            <form method="post" action="/outsource-playlists">
                <input type="hidden" name="project_id" value="{{ project_id }}">
                <input type="hidden" name="selected_ids" value="{{ selected_ids | join(',') }}">

                <label>
                    <span>Vendor</span>
                    <input
                            type="text"
                            name="vendor"
                            value="{{ vendor_name }}"
                            required
                    >
                </label>

                <label>
                    <span>Description</span>
                    <textarea name="description" required>{{ description }}</textarea>
                </label>

                <div>
                    <button type="submit">Submit Outsource Job</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
