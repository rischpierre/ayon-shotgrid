<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f172a;
    --panel: #0b1220;
    --text: #e5e7eb;
    --muted: #9ca3af;
  }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 24px;
    background: radial-gradient(1200px 800px at 20% -10%, #1e293b 20%, var(--bg) 70%);
    color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
  }
  .wrap {
    max-width: 860px; margin: 0 auto;
  }
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    overflow: hidden;
  }
  .header {
    display: flex; align-items: center; gap: 12px;
    padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.08);
    background: linear-gradient(180deg, rgba(0,0,0,0.2), rgba(0,0,0,0));
  }
  .badge {
    display: inline-block; padding: 6px 10px; font-weight: 600;
    color: white; border-radius: 999px; letter-spacing: 0.25px;
  }
  h1 { font-size: 18px; margin: 0; }
  .content { padding: 18px 20px 8px 20px; }
  .message { color: var(--text); margin: 0 0 10px 0; }
  .details { color: var(--muted); margin: 0 0 6px 16px; }
  pre {
    background: var(--panel);
    color: #d1d5db;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 14px; overflow: auto;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .footer {
    padding: 10px 20px 16px 20px; color: var(--muted); font-size: 12px;
  }
  a, a:visited { color: #93c5fd; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .btn {
    display: inline-block; padding: 10px 20px; margin: 12px 0;
    background: linear-gradient(180deg, #2563eb, #1d4ed8);
    border: 1px solid #3b82f6; border-radius: 8px;
    color: white; font-weight: 600; text-decoration: none;
    box-shadow: 0 2px 6px rgba(37,99,235,0.3);
    transition: all 0.2s;
  }
  .btn:hover {
    background: linear-gradient(180deg, #1d4ed8, #1e40af);
    box-shadow: 0 4px 12px rgba(37,99,235,0.5);
    text-decoration: none; transform: translateY(-1px);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header">
        <span class="badge" style="background: {{ badge_color }}; border: 1px solid {{ border_color }};">{{ badge_label }}</span>
        <h1>{{ title }}</h1>
      </div>
      <div class="content">
        <p class="message">{{ message }}</p>
        {% if download_url %}
        <a href="{{ download_url }}" class="btn">📥 Download Report (XLSX)</a>
        {% endif %}
        <ul class="details">
          {{ items_html|safe }}
        </ul>
        <pre>{{ safe_pre }}</pre>
      </div>
      <div class="footer">
        {{ footer_text }}
      </div>
    </div>
  </div>
</body>
</html>
