<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Whiteboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/static/favicon.png" />
    <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<header>
    <strong>Whiteboard</strong>
    <div style="display:flex; align-items:center; gap:8px;">
        <label for="projectSelect" style="font-size:12px; color:#c7cbe0;">Project</label>
        <select id="projectSelect" style="background:#0f1330; color:#e7e9ef; border:1px solid #2a2f58; border-radius:6px; padding:6px 8px;">
            <option>Loading…</option>
        </select>
    </div>
    <div class="mode-tabs">
        <button data-mode="shots" class="active">Shots</button>
        <button data-mode="assets">Assets</button>
    </div>
    <div style="margin-left:auto;">
        <button id="publishBtn" class="btn primary">Publish…</button>
    </div>
</header>

<div class="artist-bar" id="artistBar"></div>

<section id="weeks"></section>

<div class="task-picker" id="taskPicker" aria-hidden="true">
    <header id="taskPickerHeader">Choose task</header>
    <div class="options" id="taskOptions"></div>
</div>

<!-- Context menu for assignee avatars -->
<div class="context-menu" id="contextMenu" aria-hidden="true">
    <div class="item" id="ctxUnassign">Unassign</div>
</div>

<!-- Context menu for day headers (annotations) -->
<div class="context-menu" id="dayMenu" aria-hidden="true">
    <div class="item" id="dayAddEdit">Add/Modify annotation…</div>
    <div class="item" id="dayRemove">Remove annotation</div>
    <div class="item" id="dayColor">Set color ▶
        <div id="dayColorSub" style="position:absolute; left:100%; top:0; display:none; background:#0f1330; border:1px solid #2a2f58; border-radius:8px; padding:4px; white-space:nowrap;"></div>
    </div>
</div>

<div class="modal" id="publishModal" aria-hidden="true">
  <div class="dialog">
    <header style="padding:10px 12px; border-bottom:1px solid #24294d;">
      <h3>Publish changes to ShotGrid</h3>
      <button class="btn" id="closePublish">✕</button>
    </header>
    <div class="body">
      <div id="changesContainer">
        <div style="color:#9aa3b2;">No changes pending.</div>
      </div>
    </div>
    <footer>
      <button class="btn" id="cancelPublish">Cancel</button>
      <button class="btn primary" id="confirmPublish">Publish</button>
    </footer>
  </div>
</div>

<footer>Drag artist thumbnails onto shot cards to assign. Drag any card to another day to reschedule. Assignments only allowed for shots.</footer>

<script type="module" src="/static/app.js"></script>
</body>
</html>
